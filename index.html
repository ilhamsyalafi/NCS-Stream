<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCS Stream - NoCopyrightSounds Music Catalog</title>
  <link rel="stylesheet" href="style.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- HEADER / NAVBAR -->
  <header class="navbar">
    <div class="nav-container">
      <a href="#home" class="logo">
        <div class="logo-badge">NCS</div>
        <span class="logo-text">STREAM</span>
      </a>

      <div class="search-box">
        <i data-lucide="search"></i>
        <input type="text" id="global-search" placeholder="Cari lagu, artis, atau genre...">
        <div class="search-results" id="search-results"></div>
      </div>

      <button class="mobile-menu-btn" id="mobile-menu-toggle" aria-label="Toggle Menu">
        <i data-lucide="menu"></i>
      </button>

      <nav class="nav-links" id="nav-links">
        <a href="#home" class="nav-item active" data-page="home"><i data-lucide="home"></i> Home</a>
        <a href="#music" class="nav-item" data-page="music"><i data-lucide="disc"></i> Music</a>
        <a href="#artists" class="nav-item" data-page="artists"><i data-lucide="users"></i> Artists</a>
        <a href="#genres" class="nav-item" data-page="genres"><i data-lucide="grid"></i> Genres</a>
        <a href="#playlists" class="nav-item" data-page="playlists"><i data-lucide="list-music"></i> Playlists</a>
        <a href="#favorites" class="nav-item" data-page="favorites"><i data-lucide="heart"></i> Favorites</a>
      </nav>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER (SPA VIEWS) -->
  <main class="main-content" id="app-content">
    <!-- Konten halaman dirender secara dinamis oleh script.js -->
  </main>

  <!-- GLOBAL AUDIO PLAYER BOTTOM BAR -->
  <div class="global-player" id="global-player">
    <div class="player-container">
      <!-- Player Left: Track Details -->
      <div class="player-left" id="player-track-info">
        <img id="player-cover" src="" alt="Album Cover">
        <div class="player-info">
          <div class="player-title" id="player-title">Tidak Ada Lagu</div>
          <div class="player-artist" id="player-artist">-</div>
        </div>
        <button class="icon-btn favorite-btn" id="player-fav-btn" title="Tambah ke Favorit">
          <i data-lucide="heart"></i>
        </button>
      </div>

      <!-- Player Center: Controls & Seekbar -->
      <div class="player-center">
        <div class="player-controls">
          <button class="icon-btn" id="btn-shuffle" title="Acak (Shuffle)">
            <i data-lucide="shuffle"></i>
          </button>
          <button class="icon-btn" id="btn-prev" title="Sebelumnya">
            <i data-lucide="skip-back"></i>
          </button>
          <button class="play-main-btn" id="btn-play-pause" title="Putar/Jeda">
            <i data-lucide="play"></i>
          </button>
          <button class="icon-btn" id="btn-next" title="Berikutnya">
            <i data-lucide="skip-forward"></i>
          </button>
          <button class="icon-btn" id="btn-repeat" title="Ulangi (Repeat)">
            <i data-lucide="repeat"></i>
          </button>
        </div>

        <div class="player-progress">
          <span id="current-time">0:00</span>
          <input type="range" id="seek-bar" value="0" min="0" max="100" step="0.1">
          <span id="total-duration">0:00</span>
        </div>
      </div>

      <!-- Player Right: Queue & Volume -->
      <div class="player-right">
        <div class="volume-control">
          <button class="icon-btn" id="btn-mute" title="Mute/Unmute">
            <i data-lucide="volume-2"></i>
          </button>
          <input type="range" id="volume-bar" value="80" min="0" max="100">
        </div>
        <button class="icon-btn" id="btn-toggle-queue" title="Antrean Pemutaran">
          <i data-lucide="list"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- QUEUE DRAWER PANEL -->
  <div class="queue-drawer" id="queue-drawer">
    <div class="queue-header">
      <h3>Antrean Pemutaran</h3>
      <button class="icon-btn" id="btn-close-queue"><i data-lucide="x"></i></button>
    </div>
    <div class="queue-list" id="queue-list">
      <!-- Item antrean dirender secara dinamis -->
    </div>
  </div>

  <!-- CREATE PLAYLIST MODAL -->
  <div class="modal-overlay" id="playlist-modal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Buat Playlist Baru</h3>
        <button class="icon-btn" id="btn-close-modal"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body">
        <input type="text" id="playlist-name-input" placeholder="Nama Playlist..." class="form-input">
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="btn-cancel-modal">Batal</button>
        <button class="btn btn-primary" id="btn-save-playlist">Simpan</button>
      </div>
    </div>
  </div>

  <!-- ADD TO PLAYLIST SELECTION MODAL -->
  <div class="modal-overlay" id="add-to-playlist-modal">
    <div class="modal">
      <div class="modal-header">
        <h3>Pilih Playlist</h3>
        <button class="icon-btn" id="btn-close-add-modal"><i data-lucide="x"></i></button>
      </div>
      <div class="modal-body" id="playlist-select-list">
        <!-- Daftar pilihan playlist dirender di sini -->
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION SYSTEM -->
  <div class="toast-container" id="toast-container"></div>

  <!-- AUDIO ELEMENT INTERNAL -->
  <audio id="main-audio"></audio>

  <script src="script.js"></script>
</body>
</html>
